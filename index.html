<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Диктант слов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: одна колонка, на телефоне карточка на весь экран; сверху тонкая полоса прогресса. */
:root{--bg:#F2F4F8;--card:#FFFFFF;--ink:#101A33;--muted:#5B6784;--accent:#3050F0;--on-accent:#FFFFFF;--ok:#12805C;--ok-bg:#DDF3EA;--bad:#C42B3A;--bad-bg:#FBE3E5;--line:#D9DFEB;--soft:#E7ECF6;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1322;--card:#171E33;--ink:#E8ECF8;--muted:#93A0C0;--accent:#8DA2FF;--on-accent:#0E1322;--ok:#4FD1A0;--ok-bg:#123B30;--bad:#FF7A86;--bad-bg:#3F1B22;--line:#2A3350;--soft:#1F2842;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1322;--card:#171E33;--ink:#E8ECF8;--muted:#93A0C0;--accent:#8DA2FF;--on-accent:#0E1322;--ok:#4FD1A0;--ok-bg:#123B30;--bad:#FF7A86;--bad-bg:#3F1B22;--line:#2A3350;--soft:#1F2842;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--muted);text-align:right}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;background:var(--accent);color:var(--on-accent);min-height:48px;width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.panel h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px}
.rows{display:grid;gap:8px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;min-height:48px;width:100%}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.chip b{font-family:var(--mono);font-weight:500;font-size:15px}
.chip small{display:block;color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:0;font-size:15px}
.stats dt{color:var(--muted)}.stats dd{margin:0;font-family:var(--mono);font-weight:500}
.cnt{display:flex;align-items:center;gap:12px;margin:14px 0}
.cnt label{color:var(--muted);font-size:15px;flex:1}
.cnt input{width:88px;font:inherit;font-size:16px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:24px 18px 18px}
.card.ok{border-color:var(--ok);background:var(--ok-bg)}
.card.bad{border-color:var(--bad);background:var(--bad-bg)}
.ru{font-size:28px;font-weight:600;line-height:1.2;margin:4px 0 20px;overflow-wrap:anywhere;letter-spacing:-.01em}
.card input{width:100%;font-family:var(--mono);font-size:18px;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.card.ok input,.card.bad input{background:var(--card)}
.verdict{margin:14px 0 0;min-height:48px;font-size:15px}
.verdict b{font-family:var(--mono);font-weight:500;font-size:19px;display:block}
.ok .verdict{color:var(--ok)}.bad .verdict{color:var(--bad)}
.acts{display:grid;gap:8px;margin-top:14px}
.acts.two{grid-template-columns:1fr 1fr}
.big{font-size:44px;font-weight:600;font-family:var(--mono);margin:0}
.err{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.err span{color:var(--muted)}.err b{font-family:var(--mono);font-weight:500}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head><body>
<div class="wrap">
<header><h1>Диктант слов</h1><div class="sync" id="sync">загрузка…</div></header>

<section id="home">
 <div class="panel"><h2>Что повторять</h2><div class="rows" id="sets"></div>
  <div class="cnt"><label for="n">Сколько слов</label><input id="n" type="number" inputmode="numeric" min="1" max="50" value="15"></div>
  <button class="btn" id="start">Начать</button></div>
 <div class="panel"><h2>Твой прогресс</h2><dl class="stats" id="stats"></dl></div>
</section>

<section id="play" hidden>
 <div class="meta"><span id="pos"></span><span id="tag"></span></div>
 <div class="bar"><i id="fill"></i></div>
 <form class="card" id="card" autocomplete="off">
  <div class="ru" id="ru"></div>
  <input id="ans" type="text" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="по-английски" aria-label="Английское слово">
  <div class="verdict" id="verdict" aria-live="polite"></div>
  <div class="acts" id="acts"></div>
 </form>
 <div class="acts" style="margin-top:12px"><button class="btn ghost" id="quit" type="button">Закончить</button></div>
</section>

<section id="done" hidden>
 <div class="panel"><h2>Итог</h2><p class="big" id="score"></p><p id="scoreText" style="color:var(--muted);margin:4px 0 0"></p></div>
 <div class="panel" id="errPanel"><h2>Где были ошибки</h2><div id="errs"></div></div>
 <div class="acts"><button class="btn" id="again">Повторить ошибки</button><button class="btn ghost" id="copy" type="button">Скопировать итог</button><button class="btn ghost" id="home2">В начало</button></div>
 <p id="copyMsg" style="color:var(--muted);font-size:14px;margin:8px 0 0" aria-live="polite"></p>
</section>
</div>

 [['Слов в словаре',D.length],['Писал здесь',seen],['Сегодня',today],['Верных ответов',att?Math.round(cor/att*100)+'%':'—']].forEach(function(p){var a=document.createElement('dt'),b=document.createElement('dd');a.textContent=p[0];b.textContent=p[1];st.appendChild(a);st.appendChild(b)});

function norm(t){return t.toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim()}
function answers(e){var out=[norm(e)];var parts=e.split(/ \/ |, /);if(parts.length>1)parts.forEach(function(p){out.push(norm(p))});return out}
function pick(list,n){
 var now=Date.now();
 var sc=list.map(function(x){var s=stat(x.id);var w=1;
  if(!s.a)w+=2;if(!x.d&&!s.a)w+=1;if(x.h)w+=1.5;
  w+=s.x*1.5-Math.min(s.s,4)*.5;
  if(s.t)w+=Math.min((now-s.t)/864e5,14)/7;
  return {x:x,k:Math.max(.2,w)*Math.random()}});
 sc.sort(function(a,b){return b.k-a.k});
 return sc.slice(0,n).map(function(o){return o.x});
}
function begin(words){
 if(!words.length){alert_();return}
 qs={queue:words.slice(),total:words.length,resolved:0,errs:{},first:{},typed:{},tries:{},stage:'ask',cur:null,setName:SETS.filter(function(s){return s[0]===curSet})[0][1]};
 $('home').hidden=true;$('done').hidden=true;$('play').hidden=false;next();
}
function alert_(){$('sets').insertAdjacentHTML('beforeend','<p style="color:var(--bad);margin:8px 0 0">В этом наборе нет слов. Выбери другой.</p>')}
function next(){
 if(!qs.queue.length){finish();return}
 qs.cur=qs.queue.shift();qs.stage='ask';
 var c=$('card');c.className='card';$('ru').textContent=qs.cur.r;
 var a=$('ans');a.value='';a.readOnly=false;
 $('verdict').innerHTML='';
 $('pos').textContent='Слово '+Math.min(qs.resolved+1,qs.total)+' из '+qs.total;
 var s=stat(qs.cur.id);$('tag').textContent=qs.cur.h||s.x?'трудное':(qs.cur.d||s.a?'уже проверялось':'новое');
 $('fill').style.width=Math.round(qs.resolved/qs.total*100)+'%';
 acts([['Проверить','submit',''],['Не знаю','button','ghost',giveUp]]);
 setTimeout(function(){a.focus()},30);
}
function acts(list){
 var box=$('acts');box.innerHTML='';box.className='acts'+(list.length>1?' two':'');
 list.forEach(function(b){var e=document.createElement('button');e.className='btn '+(b[2]||'');e.type=b[1];e.textContent=b[0];if(b[3])e.onclick=b[3];box.appendChild(e)});
}
function show(ok,given){
 var c=$('card'),v=$('verdict');c.className='card '+(ok?'ok':'bad');
 v.innerHTML='';var t=document.createElement('span');t.textContent=ok?'Верно':(given?'Правильно:':'Неверно. Правильно:');v.appendChild(t);
 if(!ok){var b=document.createElement('b');b.textContent=qs.cur.e;v.appendChild(b)}
 $('ans').readOnly=true;qs.stage='shown';qs.ok=ok;
 acts([[qs.queue.length||!ok?'Дальше':'Закончить','submit','']]);
}
function giveUp(){if(qs.stage!=='ask')return;judge(false,true)}
function judge(ok,gaveUp){
 var id=qs.cur.id;
 qs.tries[id]=(qs.tries[id]||0)+1;
 if(!ok&&!gaveUp){(qs.typed[id]=qs.typed[id]||[]).push($('ans').value.trim())}
 if(!(id in qs.first)){qs.first[id]=ok;record(id,ok)}else{record(id,ok)}
 if(ok){qs.resolved++}else{qs.errs[id]=qs.cur;qs.queue.push(qs.cur)}
 show(ok,gaveUp);
}
$('card').addEventListener('submit',function(e){
 e.preventDefault();
 if(qs.stage==='ask'){var v=norm($('ans').value);if(!v){$('verdict').textContent='Сначала напиши слово или нажми «Не знаю».';return}
  judge(answers(qs.cur.e).indexOf(v)>-1,false)}
 else if(qs.stage==='shown'){next()}
});
function finish(){
 $('play').hidden=true;$('done').hidden=false;
 var ids=Object.keys(qs.first),right=ids.filter(function(i){return qs.first[i]}).length;
 $('score').textContent=right+' из '+ids.length;
 $('scoreText').textContent='с первого раза. Остальные слова добиты до верного ответа.';
 var wrong=ids.filter(function(i){return !qs.first[i]});
 var box=$('errs');box.innerHTML='';$('errPanel').hidden=!wrong.length;$('again').hidden=!wrong.length;
 wrong.forEach(function(i){var w=D.filter(function(x){return x.id===i})[0];var r=document.createElement('div');r.className='err';var a=document.createElement('span'),b=document.createElement('b');a.textContent=w.r;b.textContent=w.e;r.appendChild(a);r.appendChild(b);box.appendChild(r)});
 qs.wrong=wrong.map(function(i){return D.filter(function(x){return x.id===i})[0]});
 render();
}
$('start').onclick=function(){
 var f=SETS.filter(function(s){return s[0]===curSet})[0][2];
 var n=Math.max(1,Math.min(50,parseInt($('n').value,10)||15));
 begin(pick(D.filter(f),n));
};
function summary(){
 var d=new Date(),pad=function(n){return(n<10?'0':'')+n};
 var ids=Object.keys(qs.first),right=ids.filter(function(i){return qs.first[i]}).length;
 var L=['Диктант '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+', набор: '+qs.setName+', с первого раза '+right+' из '+ids.length];
 ids.forEach(function(i){var w=D.filter(function(x){return x.id===i})[0];
  var line=(qs.first[i]?'верно':'ошибка')+' №'+i+' '+w.e+' ('+w.r+'), попыток '+qs.tries[i];
  if(qs.typed[i])line+=', писал: '+qs.typed[i].join(' | ');
  L.push(line)});
 return L.join('\n');
}
$('copy').onclick=function(){
 var t=summary(),m=$('copyMsg');
 var done=function(){m.textContent='Скопировано. Вставь в чат с Claude.'};
 var fail=function(){m.textContent='';var ta=document.createElement('textarea');ta.value=t;ta.readOnly=true;ta.style.cssText='width:100%;min-height:140px;margin-top:8px;font:14px var(--mono);background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px';m.appendChild(document.createTextNode('Выдели текст и скопируй вручную:'));m.appendChild(ta);ta.focus();ta.select()};
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fail)}else fail()}catch(e){fail()}
};
$('again').onclick=function(){begin(qs.wrong.slice())};
$('home2').onclick=function(){$('done').hidden=true;$('home').hidden=false;render()};
$('quit').onclick=function(){if(qs&&Object.keys(qs.first).length)finish();else{$('play').hidden=true;$('home').hidden=false}};
init();
</script>
</body></html>
